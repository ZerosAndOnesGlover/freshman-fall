# CS 212 Week 10 -- a reference OpenAPI document for slot v1
#
# Not a specification to copy: a worked example of the decisions in L31-L33,
# with the reasoning in comments. Your own document should be GENERATED from
# your FastAPI annotations (A 10 Q3) rather than hand-written -- this exists so
# you can see what good output looks like and what to check for in yours.

openapi: 3.1.0
info:
  title: slot
  version: "1.0.0"
  description: |
    Room and equipment booking for the CSE department.

    ## What is contract and what is not

    **Stable (breaking to change):** paths, methods, status codes, request and
    response field NAMES and types, and the `type` URI of every problem
    response.

    **Not contract (may change without notice):** the `title` and `detail` of
    problem responses, the format of ids beyond "an opaque string", the
    ordering of list results unless a `sort` parameter is given, and latency.

    Stating this is the only defence against Hyrum's law available to us
    (L31 section 1). It does not fully work. It helps.

servers:
  - url: https://slot.cse.example/v1     # /v1 in the PATH. Cannot be retrofitted.

paths:
  /bookings:
    post:
      summary: Create a booking, as a hold
      description: |
        Creates a HELD booking. Holds expire; see `expires_at`.
        Confirmation is a separate transition (`POST /bookings/{id}/confirm`)
        because it is the operation that carries the invariant.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, format: uuid}
          description: |
            POST is not idempotent, so a client retry -- a mobile network, a
            load-balancer timeout, a double-click -- creates a second booking.
            With this key the server returns the ORIGINAL result for a repeat.
            The unique index protects the data; this protects the user's
            experience of it (L31 section 4).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookingRequest"}
      responses:
        "201":
          description: Created, in state HELD
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Booking"}
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /bookings/{id}:
    get:
      summary: Read a booking
      parameters: [{$ref: "#/components/parameters/BookingId"}]
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Booking"}
        "404": {$ref: "#/components/responses/NotFound"}

    # NOTE: there is deliberately no DELETE here.
    # Invariant I5 says a cancelled booking is never deleted -- the registrar
    # needs the audit trail (W1 L06 section 4). Cancellation is a transition.

  /bookings/{id}/confirm:
    post:
      summary: Confirm a held booking
      description: |
        A NAMED TRANSITION rather than `PATCH {"state": "CONFIRMED"}`.
        Two reasons (L31 section 4): this is the operation that carries the
        permission check, the invariant and the failure mode; and an assignable
        `state` field invites a client to attempt HELD -> HELD.
      parameters: [{$ref: "#/components/parameters/BookingId"}]
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Booking"}
        "409":
          $ref: "#/components/responses/Conflict"
        "404": {$ref: "#/components/responses/NotFound"}

  /bookings/{id}/cancel:
    post:
      summary: Cancel a booking
      parameters: [{$ref: "#/components/parameters/BookingId"}]
      responses:
        "200":
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Booking"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema: {type: string}
      description: An opaque identifier. Do NOT assume a format or an ordering.

  schemas:
    BookingRequest:
      type: object
      required: [resource_id, slot]
      properties:
        resource_id:
          type: string
          example: TH200
        room_id:
          type: string
          deprecated: true          # <-- expand-and-contract, phase 1
          description: |
            DEPRECATED. Renamed to `resource_id` when equipment became
            bookable. Accepted until the Sunset date in the response headers.
            Usage is instrumented; see A 10 Q4(b).
        slot:
          type: string
          format: date-time
          description: |
            The START of a 50-minute teaching slot, on the hour, 08:00-19:00
            Mon-Fri. Fixed duration is deliberate: it makes the no-double-
            booking invariant an EQUALITY that a partial unique index enforces,
            where arbitrary intervals would make it an overlap that no unique
            index can express (W1 L06 section 3).

    Booking:
      type: object
      required: [id, resource_id, slot, state]
      properties:
        id:    {type: string}
        resource_id: {type: string}
        room_id:
          type: string
          deprecated: true          # returned during phase 1 as well as accepted
        slot:  {type: string, format: date-time}
        state: {type: string, enum: [HELD, CONFIRMED, CANCELLED]}
        expires_at:
          type: [string, "null"]
          format: date-time
          description: Set iff state is HELD. Invariant I2.
        _links:
          type: object
          description: |
            The transitions available FROM THIS STATE. Level 3 only where it
            pays: it means a client does not have to re-implement our state
            machine and get it wrong (L31 section 3).
          additionalProperties:
            type: object
            properties:
              href:   {type: string}
              method: {type: string}

    Problem:                        # RFC 9457
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: STABLE. Branch on this, not on `detail`.
        title:  {type: string, description: Human-readable. May change.}
        status: {type: integer}
        detail: {type: string, description: Human-readable. May change.}
        instance: {type: string}

  responses:
    Conflict:
      description: |
        The request conflicts with the current state -- almost always that the
        slot already has a confirmed booking. 409 is the most important status
        code in this API.
      content:
        application/problem+json:
          schema:
            allOf:
              - {$ref: "#/components/schemas/Problem"}
              - type: object
                properties:
                  conflicting_booking: {type: string}
          example:
            type: https://slot.cse.example/problems/slot-unavailable
            title: The requested slot is unavailable
            status: 409
            detail: TH200 already has a confirmed booking at 2026-03-04T10:00Z
            conflicting_booking: b1f3c9a2

    Unprocessable:
      description: Well-formed but semantically invalid -- e.g. outside opening hours.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

    NotFound:
      description: No such booking.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

    Forbidden:
      description: |
        Authenticated, but not permitted. Distinct from 401, which means not
        authenticated -- these are different things and conflating them makes
        client retry logic wrong.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
