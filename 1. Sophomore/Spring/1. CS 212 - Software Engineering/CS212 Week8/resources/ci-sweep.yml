# CS 212 Week 8 -- reference nightly sweep for slot
#
# .github/workflows/nightly.yml
#
# This is THE SWEEP (L25 section 5): slow, probabilistic, and it does NOT
# block. Everything here either takes minutes, depends on the network, or
# has a false-positive rate.
#
# A sweep whose output nobody reads is worse than no sweep, because it
# creates the belief that the tests are being checked. Hence the final job.

name: nightly

on:
  schedule:
    - cron: "0 3 * * *"        # 03:00 UTC
  workflow_dispatch:            # so you can run it on demand while building it

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait      # --wait honours the healthchecks
      - run: docker compose run --rm app pytest tests/e2e -q
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: compose-logs, path: compose.log}

  order-independence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.3", cache: pip, cache-dependency-path: uv.lock}
      - run: pip install uv && uv sync --frozen
      # If this fails you have shared state (W5 L18 section 5). That is a
      # finding, not a nuisance -- and it is why this is not in the gate.
      - run: uv run pytest -p randomly -p no:cacheprovider
              --randomly-seed=${{ matrix.seed }} tests/unit -q

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.3", cache: pip, cache-dependency-path: uv.lock}
      - run: pip install uv && uv sync --frozen
      # Domain and app only. Mutating route declarations produces noise
      # (W6 L21 section 6), and mutation time is mutants x suite time.
      - run: uv run mutmut run --paths-to-mutate src/slot/domain,src/slot/app || true
      - run: |
          echo '## Mutation results' >> $GITHUB_STEP_SUMMARY
          uv run mutmut results | tail -20 >> $GITHUB_STEP_SUMMARY

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12.3"}
      # Advises, never blocks (L24 section 7). A CVE either applies to your
      # version or it does not, so the false-positive rate is near zero --
      # but it fires on someone else's schedule, not on your change.
      - run: pip install uv pip-audit && uv export --format requirements-txt > req.txt
      - run: pip-audit -r req.txt || true

  # ---------------------------------------------------------------------
  # Make the result visible. A 8 Q2(c) asks who looks and by when; this is
  # the mechanism, and the answer to "by when" is a human decision your
  # charter should record.
  # ---------------------------------------------------------------------
  report:
    needs: [e2e, order-independence, mutation, dependencies]
    if: always()
    runs-on: ubuntu-latest
    permissions: {issues: write}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const failed = ${{ contains(needs.*.result, 'failure') }};
            const title = 'Nightly sweep';
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/`
              + `${context.repo.repo}/actions/runs/${context.runId}\n`
              + (failed ? '**Something failed.** See the run.' : 'All green.');
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly'});
            if (issues.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issues[0].number, body});
            } else if (failed) {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['nightly']});
            }
