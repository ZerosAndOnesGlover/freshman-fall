<!doctype html><meta charset="utf-8"><title>Viewport harness</title>
<!--
  Development tool, not part of the site.

  Vite serves anything under the project root in dev but only copies public/
  to dist, so this stays out of the production build. Open

    http://localhost:5173/dev/viewports.html?p=/portal/lectures/5

  to see a route at four widths at once, and call measure() from the console
  to list any element that widens the page rather than scrolling inside its
  own box.
-->
<style>body{margin:0;font:12px system-ui;background:#222;color:#eee}
.row{display:flex;gap:12px;padding:12px;align-items:flex-start;overflow-x:auto}
figure{margin:0}figcaption{padding:4px 0}
iframe{border:1px solid #555;background:#fff}</style>
<div class="row" id="row"></div>
<script>
const path = new URLSearchParams(location.search).get('p') || '/';
const widths = [390, 768, 1024, 1280];
document.getElementById('row').innerHTML = widths.map(w =>
  `<figure><figcaption>${w}px</figcaption>
   <iframe id="f${w}" src="${path}" width="${w}" height="760"></iframe></figure>`).join('');
window.measure = () => widths.map(w => {
  const d = document.getElementById('f'+w).contentDocument;
  if (!d) return {w, err: 'no doc'};
  const de = d.documentElement;
  const off = [];
  d.querySelectorAll('body *').forEach(el => {
    const b = el.getBoundingClientRect();
    if (b.right > de.clientWidth + 2) off.push(el.tagName + '.' + (el.className||'').toString().split(' ').slice(0,2).join('.'));
  });
  return {w, over: de.scrollWidth - de.clientWidth, off: [...new Set(off)].slice(0,5)};
});
</script>
